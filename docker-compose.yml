# Local/integration run of the production images -- NOT hot-reload dev (that's still
# `npm run dev:full` from the README). Supabase (Postgres + Auth + Storage) stays on the
# cloud project named in .env; only Qdrant, Redis and ClamAV are self-hosted here, per
# docs/MASTER-PROMPT.md's scalability_requirements ("Dockerfiles + docker-compose for local
# (web + api + worker + qdrant)" -- redis added alongside it for the same local-infra reason).
#
# Usage:
#   cp .env.example .env   # fill in SUPABASE_*, OPENROUTER_API_KEY, etc.
#   docker compose up --build

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Malware scanning for uploads (apps/api/src/platform/clamav.ts). The first start downloads
  # the virus definitions and can take a few minutes before clamd accepts connections; uploads
  # made meanwhile are stored as "pending" (unscanned), never "clean".
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: "4000"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379"
      CLAMAV_HOST: "clamav"
      CLIENT_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"
    depends_on:
      - qdrant
      - redis
      - clamav
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
    env_file: .env
    environment:
      API_INTERNAL_URL: "http://api:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant-data:
  clamav-data:
